# CI do MandaRim: valida os 3 sistemas a cada push e pull request na main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Checagem de tipos
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Testes
        run: npm test --if-present

  backend:
    name: Backend (Node.js + Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PORT: 3001
      JWT_SECRET: segredo-so-para-o-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Checagem de sintaxe
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Testes
        run: npm test --if-present
      - name: Smoke test (sobe a API e chama /health)
        run: |
          npm start &
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://localhost:3001/health

  ia-service:
    name: Serviço de IA (Python + FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ia-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ia-service/requirements.txt
      - run: pip install -r requirements.txt
      - name: Checagem de sintaxe
        run: python -m compileall -q .
      - name: Testes (pytest)
        if: hashFiles('ia-service/tests/**/*.py', 'ia-service/test_*.py') != ''
        run: |
          pip install pytest
          pytest
      - name: Smoke test (sem chave do Gemini, usa o modo mock)
        run: |
          uvicorn main:app --port 8000 &
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/generate/exercise \
            -H 'Content-Type: application/json' \
            -d '{"word": "你好", "pinyin": "ni hao", "meaning": "ola"}'

  docker:
    name: Docker (build das 3 imagens)
    runs-on: ubuntu-latest
    needs: [frontend, backend, ia-service]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
